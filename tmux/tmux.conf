# =============================================================================
# Terminal capabilities (true color)
# =============================================================================
set-option -sa terminal-overrides ",xterm*:Tc"
# Advertise 24-bit color to programs inside tmux (e.g. pi) via COLORTERM.
set-environment -g COLORTERM "truecolor"

# =============================================================================
# Prefix: Ctrl-a (lebih ergonomis dari Ctrl-b)
# =============================================================================
set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

# =============================================================================
# Window navigation (tanpa prefix)
# =============================================================================
bind -n C-j previous-window
bind -n C-k next-window

# =============================================================================
# Split: pertahankan cwd dari pane aktif
# =============================================================================
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# =============================================================================
# Pane navigation (vim-style)
# =============================================================================
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize pane (repeatable: tahan prefix, pencet HJKL berkali-kali)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# =============================================================================
# Behavior dasar
# =============================================================================
set -g extended-keys on
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# =============================================================================
# COPY MODE + CLIPBOARD (NEW: WSL2 + agent-friendly)
# =============================================================================
# Mouse: scroll, click-select, drag-select native (skip copy mode entirely)
set -g mouse on

# OSC52: tmux push selection ke clipboard OS lewat terminal escape
# Alacritty/WezTerm/kitty support langsung
set -g set-clipboard on

# vi-keys di copy mode (cocok dgn bindkey -v di zsh)
setw -g mode-keys vi

# Copy mode entry: dual bind
bind Escape copy-mode      # <prefix>Esc — semantic "enter mode"
bind -n M-u copy-mode      # Alt-u — no-prefix speed

# Scrollback panjang untuk agent log (Claude/pi output stream lama)
set -g history-limit 50000

# Visual mode binding (tmux-yank ga bind 'v', cuma 'y'/'Y'/MouseDragEnd)
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi V send-keys -X select-line
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle

# tmux-yank handle y/Y + clip.exe auto-detect — biarkan dia urus.
# Kalau mau override clip tool, set: set -g @override_copy_command 'clip.exe'

# Word boundary lebih agresif: tab-stops, brackets, equals jadi separator
# = double-click select code-token lebih akurat
set -g word-separators ' "=()[]{}<>'

# =============================================================================
# PLUGINS (TPM)
# =============================================================================
set -g @plugin 'tmux-plugins/tpm'             # Wajib ada
set -g @plugin 'tmux-plugins/tmux-sensible'   # Settingan dasar biar gak glitch
set -g @plugin 'Nybkox/tmux-kanagawa'         # Theme pilihanmu

# Session persistence (resurrect + continuum)
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# --- NEW: copy-mode / clipboard / fuzzy-pick ---
set -g @plugin 'tmux-plugins/tmux-yank'        # y di copy mode = clipboard OS
set -g @plugin 'laktak/extrakto'               # <prefix>tab = fzf semua kata visible
set -g @plugin 'fcsonline/tmux-thumbs'         # <prefix>F = hint label per-word

# tmux-yank pakai clipboard tool yg ke-detect (clip.exe di WSL2 jalan otomatis)
set -g @yank_selection_mouse 'clipboard'

# =============================================================================
# Resurrect config
# =============================================================================
# Pane content capture: simpan scrollback per pane (sebelum tmux quit)
set -g @resurrect-capture-pane-contents 'on'

# Restore OpenCode from each pane's working directory. Explicit arguments such
# as --session <id> are preserved; a plain `opencode` resumes the latest local
# session through the wrapper.
set -g @resurrect-processes '"~opencode->~/.config/tmux/opencode-resurrect.sh *"'

# DISABLED SEMENTARA — auto-restore nvim session dari dalam tmux pane.
# Bentrok dgn sessions.lua: VimEnter restore prompt + auto-save timer di nvim
# akan double-fire kalau tmux juga restore nvim session.
# Aktifkan lagi kalau sessions.lua di-replace dgn nvim-possession.
# set -g @resurrect-strategy-nvim 'session'

# =============================================================================
# Continuum config
# =============================================================================
set -g @continuum-restore 'off'          # manual restore via <prefix>Ctrl-r
set -g @continuum-save-interval '10'     # auto-save tiap 10 menit

# =============================================================================
# Extrakto config (NEW) — agent log fuzzy picker
# =============================================================================
set -g @extrakto_key 'tab'               # <prefix>tab buka picker
set -g @extrakto_clip_tool 'clip.exe'    # WSL2 clipboard
set -g @extrakto_split_direction 'p'     # popup floating (butuh tmux 3.2+, lu 3.4 ✓)
set -g @extrakto_grab_area 'window full' # scan seluruh window, bukan pane aja
set -g @extrakto_fzf_layout 'reverse'

# =============================================================================
# Thumbs config (NEW) — vimium-style word picker
# =============================================================================
set -g @thumbs-key F                                              # <prefix>F masuk thumbs mode
set -g @thumbs-command 'echo -n {} | clip.exe'                    # lowercase hint = copy
set -g @thumbs-upcase-command 'echo -n {} | clip.exe && tmux paste-buffer'  # uppercase = copy + paste

# =============================================================================
# Theme: kanagawa
# =============================================================================
set -g @kanagawa-plugins "network ssh-session"
set -g @kanagawa-show-empty-plugins false
set -g @kanagawa-show-network-ethernet true
set -g @kanagawa-theme 'wave'                 # Pilihan: wave, lotus, dragon
set -g @kanagawa-ignore-window-colors true    # Background nyatu sama terminal (transparent support)
set -g @kanagawa-left-separator "█"
set -g @kanagawa-right-separator "█"
set -g @kanagawa-show-flags true
set -g @kanagawa-refresh-rate 5

set -g status-position top
# set -g pane-border-status top
# set -g pane-border-format ""

# =============================================================================
# TPM init (HARUS line terakhir)
# =============================================================================
run '~/.tmux/plugins/tpm/tpm'
